[project]
name = "jobfit-backend"
version = "0.1.0"
description = "JobFit – AI job search and resume tailoring backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Data validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database (Supabase)
    "supabase>=2.5",
    # HTTP client
    "httpx>=0.27",
    # Resume parsing
    "pypdf>=4.2",
    "python-docx>=1.1",
    # Document rendering
    "jinja2>=3.1",
    "weasyprint>=62",
    # AI
    "google-generativeai>=0.8",
    # Structured logging
    "structlog>=24.2",
    # Security
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Utilities
    "anyio>=4.4",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",        # for TestClient
    "respx>=0.21",        # HTTP mock
    "ruff>=0.4",
    "pyright>=1.1",
    "pre-commit>=3",
    "faker>=25",          # synthetic fixture data
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG"]
ignore = [
    "S101",   # assert allowed in tests
    "S608",   # SQL injection checked separately
    "B008",   # FastAPI Depends() calls in defaults
    "A003",   # shadowing builtins (id field)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
